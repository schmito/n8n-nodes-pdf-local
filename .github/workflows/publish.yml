name: Publish to npm

# Publishes on a version tag, e.g. `git tag v0.2.0 && git push --tags`.
#
# Authentication is npm trusted publishing (OIDC): GitHub mints a short-lived,
# workflow-scoped token that npm verifies against the trusted publisher
# configured on the package. There is no NPM_TOKEN secret to store, leak or
# rotate, and no interactive 2FA challenge.
#
# The trusted publisher on npmjs.com must name this exact workflow filename
# (publish.yml), the owner (schmito) and the repository (n8n-nodes-pdf-local),
# and must leave Environment empty since this workflow declares none. Any
# mismatch fails at the publish step with a 404 rather than an auth error.
#
# Structure follows the npm docs example deliberately: workflow-level
# permissions, Node 24, and package-manager-cache disabled. Keep it that way so
# that when something breaks, the difference from the documented setup is the
# project-specific steps and nothing else.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # required: lets GitHub mint the OIDC token for npm
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Guard against tagging v0.2.0 while package.json still says 0.1.0.
      # npm would publish the package.json version and the tag would lie.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG npm=$(npm --version)"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Temporary diagnostic: separates "GitHub never minted an OIDC token"
      # from "npm rejected the one it got". Prints presence only, never values.
      - name: Diagnose OIDC availability
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set : ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"
          echo "repository : ${GITHUB_REPOSITORY}"
          echo "workflow ref: ${GITHUB_WORKFLOW_REF}"
          echo "npm version : $(npm --version)"

      - run: npm ci

      # Fixtures are generated rather than committed, and the generator needs
      # qpdf to produce the encrypted PDFs the tests decrypt.
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf

      - name: Build test fixtures
        run: npm run fixtures

      - run: npm test

      - run: npm run build

      # No token and no --provenance flag: OIDC supplies the credential and
      # attaches provenance automatically.
      - run: npm publish
